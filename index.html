<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Fernando Añaña" />
    <meta
      name="description"
      content="An online recipes book! Here you will find recipes for breakfasts, lunchs, dinners and even more! All the meals you will need you will find them in Sofia's Kitchen"
    />
    <link rel="stylesheet" href="styles/normalize.css" />
    <link rel="stylesheet" href="styles/small.css" />
    <link rel="stylesheet" href="styles/medium.css" />
    <link rel="stylesheet" href="styles/large.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <script src="scripts/navigation.js" defer></script>
    <title>Sofia's Kitchen</title>
  </head>
  <body>
    <aside id="side-bar" class="side-bar">
      <header class="sb-content">
        <nav class="navigation">
          <ul>
            <li class="current"><a href="#">Home</a></li>
            <li><a href="#">Categories</a></li>
            <li><a href="#">Ingredients</a></li>
          </ul>
        </nav>
      </header>

      <footer class="sb-content">
        <div class="personal-info">
          <p>© 2026 | Fernando Añaña | Uruguay</p>
          <p>f.s.anana.g.work@gmail.com</p>
        </div>
        <div class="social-media">
          <a href=""><img src="images/linkedin.svg" alt="Linkedin logo" /></a>
          <a href=""><img src="images/github.svg" alt="GitHub logo" /></a>
          <a href=""><img src="images/email.svg" alt="Email logo" /></a>
        </div>
      </footer>
    </aside>
    <main>
      <section class="hero">
        <button id="ham-btn" class="ham-btn"></button>
        <div class="main-content">
          <h1>Sofia's Kitchen</h1>
          <div class="main-btn">
            <button class="categories">Categories</button>
            <button class="ingredients">Ingredients</button>
          </div>
          <form action="/search" method="get">
            <input
              type="search"
              name="Search bar"
              placeholder="Type a recipe or ingredient"
            />
          </form>
        </div>
        <picture class="hero-img">
          <source srcset="images/hero-large.webp" media="(min-width:1000px)" />
          <source srcset="images/hero-medium.webp" media="(min-width:600px)" />
          <img
            class="hero-img"
            src="images/hero-small.webp"
            alt="Food in a table"
          />
        </picture>
      </section>
    </main>
  </body>
</html>
